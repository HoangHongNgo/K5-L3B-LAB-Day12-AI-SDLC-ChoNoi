<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Canvas 2D là bản dự phòng cho thiết bị không dựng được khung hình 3D.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const screen = document.getElementById("screen");
const screenTitle = document.getElementById("screen-title");
const screenContent = document.getElementById("screen-content");
const screenActions = document.getElementById("screen-actions");
const screenMessage = document.getElementById("screen-message");
const shop = document.getElementById("shop");
const shopBalance = document.getElementById("shop-balance");
const shopUpgrades = document.getElementById("shop-upgrades");
const shopFeedback = document.getElementById("shop-feedback");
let screenName = "", introTimer, introBusy = false, dayStarted = false;

// ---------- vào: phím ----------
const down = new Set();
const touchHeld = new Map();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap?.phase || snap?.mode;
  const held = new Set([...down, ...touchHeld.values()]);
  const dx = (held.has("r") ? 1 : 0) - (held.has("l") ? 1 : 0);
  let dy = (held.has("d") ? 1 : 0) - (held.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: held.has("interact"), catch: held.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
function sendInput(command) {
  queue.push(JSON.stringify(command));
  flush();
}
function press(button) {
  sendInput({ [button]: true });
  sendInput({ [button]: false });
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (!screen.hidden) {
    if (k === "tab") {
      const buttons = Array.from(screen.querySelectorAll("button:not(:disabled), input:not(:disabled)")).filter(button => button.offsetWidth);
      const atFirst = document.activeElement === buttons[0] || document.activeElement === screenTitle;
      if (buttons.length && ((e.shiftKey && atFirst) || (!e.shiftKey && document.activeElement === buttons.at(-1)))) {
        e.preventDefault();
        (e.shiftKey ? buttons.at(-1) : buttons[0]).focus();
      }
    }
    if (screenName === "atlas-lobby" && ["m","escape"].includes(k)) { e.preventDefault(); showMenu(); return; }
    if (screenName === "menu" && k === "m") { e.preventDefault(); openAtlas("map"); return; }
    if ((screenName === "help" || screenName === "exit") && k === "escape") {
      e.preventDefault(); showMenu(); return;
    }
    if (screenName === "menu" && k === "enter" && e.target.tagName !== "BUTTON") {
      e.preventDefault(); startPlay(); return;
    }
    if ((screenName === "finished" || screenName === "error") && k === "r") {
      e.preventDefault(); returnToMenu(); return;
    }
    if (screenName === "day-intro" && !e.ctrlKey && !e.metaKey && !e.altKey && k !== "tab") {
      e.preventDefault();
      continueDay();
    }
    if (screenName === "pause" && ["escape","p","m"].includes(k)) {
      e.preventDefault();
      press("pause");
    }
    return;
  }
  if (snap && ["escape","p","m"].includes(k)) {
    e.preventDefault();
    openAtlas(k === "m" ? "map" : "mission");
    return;
  }
  if (e.target.closest("select") && k.startsWith("arrow")) return;
  if (e.target.closest("button, select") && (k === " " || k === "enter")) return;
  if (snap?.phase === "shop") return;
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r" && snap?.mode !== "day") { returnToMenu(); return; }
  pushInput();
});
addEventListener("keyup", (e) => {
  if (!screen.hidden) return;
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
function clearHeld() {
  down.clear(); touchHeld.clear();
  document.querySelectorAll(".held").forEach(button => button.classList.remove("held"));
  pushInput();
}
addEventListener("blur", () => { if (screen.hidden) clearHeld(); });
document.querySelectorAll("[data-move],[data-action]").forEach(button => {
  button.addEventListener("pointerdown", e => {
    if (!screen.hidden || !shop.hidden) return;
    e.preventDefault(); button.setPointerCapture(e.pointerId);
    touchHeld.set(e.pointerId, button.dataset.move || button.dataset.action);
    button.classList.add("held"); pushInput();
  });
  button.addEventListener("lostpointercapture", e => {
    touchHeld.delete(e.pointerId);
    button.classList.remove("held"); pushInput();
  });
});


function element(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}
function action(label, onClick, secondary = false) {
  const button = element("button", label);
  button.type = "button";
  if (secondary) button.className = "secondary";
  button.addEventListener("click", onClick);
  return button;
}
function listSection(title, lines, empty) {
  const section = document.createElement("section");
  section.append(element("h2", title));
  if (lines.length) {
    const list = document.createElement("ul");
    list.append(...lines.map((line) => element("li", line)));
    section.append(list);
  } else {
    section.append(element("p", empty));
  }
  return section;
}
function showScreen(name, title, content = [], actions = []) {
  clearTimeout(introTimer);
  if (down.size || touchHeld.size) clearHeld();
  screenName = name;
  screen.dataset.page = name;
  const kickers = {"day-intro":"Buổi sáng · Thực đơn của Má Tư","evening-intro":"Buổi tối · Bếp trên sông","day-result":"Cuối ngày · Sổ thu chi",summary:"Nhật ký phiên chợ",help:"Sổ tay người chơi",pause:"Nghỉ tay",exit:"Rời chuyến",finished:"Kết thúc ca"};
  document.getElementById("panel-kicker").textContent = kickers[name] || "";
  screenTitle.textContent = title;
  screenContent.replaceChildren(...content);
  screenActions.replaceChildren(...actions);
  screenMessage.hidden = true;
  screen.hidden = false;
  shop.inert = true;
  screenTitle.focus();
}
function closeScreen() {
  clearTimeout(introTimer);
  screenName = "";
  screen.hidden = true;
  shop.inert = false;
}
function ingredientLines(counts) {
  return Object.entries(counts || {}).filter(([, count]) => count > 0)
    .map(([kind, count]) => `${KIND_NAME[kind] || kind} × ${count}`);
}
function icon(name) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class","icon"); svg.setAttribute("aria-hidden","true");
  const use = document.createElementNS(ns,"use");
  use.setAttribute("href","#i-" + name); svg.append(use); return svg;
}
const journey = [
  {time:"Buổi sáng", name:"Lặn & hái", icon:"sun", tips:["Dùng WASD hoặc phím mũi tên để bơi. Phím xuống giúp Út Sen lặn sâu, phím lên đưa Sen về mặt nước để lấy oxy.","Bấm E để hái bông trên mặt nước, Space để bắt đàn cá ở gần. Về bến rồi bấm E để chuyển nguyên liệu vào kho."]},
  {time:"Buổi tối", name:"Mở quán", icon:"bowl", tips:["Đi đến bếp rồi bấm E để nấu đơn khách đã gọi. Khi chín, bấm E ở bếp lần nữa để bưng món.","Đến đúng bàn rồi bấm E để phục vụ khi khách còn kiên nhẫn."]},
  {time:"Cuối ngày", name:"Ghé tiệm", icon:"shop", tips:["Dùng tiền bán món để mua bình oxy hoặc áo phao. Nâng cấp có hiệu lực từ ngày kế tiếp.","Chọn Đóng tiệm để sang ngày mới."]},
];
function showHelp(index) {
  const pages = index === undefined ? journey : [journey[index]];
  const lines = pages.map(page => listSection(page.time + " · " + page.name,page.tips));
  showScreen("help",index === undefined ? "Cách chơi" : journey[index].name,lines,[action("Về màn hình chính",showMenu)]);
}
journey.forEach((page,index) => {
  const button=action("",()=>showHelp(index)); button.className="journey-step";
  const label=document.createElement("span"); label.append(element("small",page.time),element("b",page.name));
  button.append(icon(page.icon),label); document.getElementById("journey").append(button);
});
const fullButton=document.getElementById("full-screen");
if (!document.fullscreenEnabled) fullButton.hidden=true;
fullButton.addEventListener("click",async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch { screenMessage.textContent="Trình duyệt chưa thể mở toàn màn hình."; screenMessage.hidden=false; }
});
document.addEventListener("fullscreenchange",() => {
  const label=document.fullscreenElement?"Thu nhỏ":"Toàn màn hình";
  fullButton.querySelector("span").textContent=label; fullButton.title=label; fullButton.setAttribute("aria-label",label);
});
document.getElementById("exit-game").onclick=()=>showScreen("exit","Đã rời phiên chợ",
  [element("p","Bạn có thể đóng thẻ này hoặc trở lại bến.")],[action("Về màn hình chính",showMenu)]);
function startPlay() {
  dayStarted=true;
  if (snap.mode === "day") showDayIntro(snap);
  else if (snap.mode === "quan" && snap.opening_menu) showEveningIntro(snap);
  else continueDay();
}
function showMenu() {
  dayStarted=false; shop.hidden=true;
  window.ForageGuide?.reset(document.getElementById("forage-guide"));
  window.flashAction?.("");
  const play=action("Bắt đầu chơi",startPlay); play.prepend(icon("play"));
  const help=action("Cách chơi",()=>showHelp(),true); help.prepend(icon("book"));
  const copy = snap.mode === "quan" ? "Nhận đơn, nhóm bếp và cùng Má Tư đãi khách một bữa cơm trên sông."
    : snap.mode === "gather" ? "Xuống nước cùng Út Sen, hái bông súng và bắt đàn cá cho bữa chiều ở bến."
    : "Theo Út Sen lặn tìm nguyên liệu, rồi về bến nấu bữa chiều cùng Má Tư.";
  showScreen("menu","Quán ăn Chợ Nổi",[element("p",copy)],[play,help]);
  screenTitle.replaceChildren(document.createTextNode("Quán ăn "),element("em","Chợ Nổi"));
}
function showDayIntro(state) {
  const plan = state.day_plan || {};
  const dishes = Object.entries(plan.dishes || {}).map(([id, count]) => `${dishName(id)} × ${count} suất`);
  showScreen("day-intro", `Ngày ${state.day}`, [
    listSection("Má Tư định nấu", dishes, "Chưa có món trong kế hoạch."),
    listSection("Nguyên liệu cần lấy", ingredientLines(plan.ingredients), "Không có mục tiêu thu gom."),
  ], [action("Bắt đầu lặn", continueDay)]);
  introTimer = setTimeout(continueDay, 4000);
}
function showEveningIntro(state) {
  if (!state.opening_menu || !window.openingBoard) {
    showScreen("evening-intro", "Chuẩn bị mở quán", [
      listSection("Kho khả dụng", ingredientLines(availableStock(state)), "Kho trống."),
    ], [action("Mở quán", continueDay)]);
    return;
  }
  const board = openingBoard(state, state.opening_stock || availableStock(state));
  showScreen("evening-intro", state.day ? `Thực đơn · Ngày ${state.day}` : "Thực đơn hôm nay",
    [board.content], [board.openButton]);
}
async function continueDay(menuIds) {
  if (introBusy) return;
  clearTimeout(introTimer);
  introBusy = true;
  const currentScreen = screenName;
  try {
    const {day, phase, tick} = snap;
    const response = await fetch("/continue", {
      method: "POST", body: JSON.stringify({ day, phase, tick, service_id: snap.service_id, menu_ids: Array.isArray(menuIds) ? menuIds : undefined }),
      headers: { "Content-Type": "application/json" },
    });
    if (!response.ok) throw new Error("continue");
    if (screenName === currentScreen) closeScreen();
  } catch (e) {
    screenMessage.textContent = "Chưa thể vào chơi. Hãy thử lại.";
    screenMessage.hidden = false;
  } finally {
    introBusy = false;
  }
}
async function returnToMenu() {
  if (introBusy) return;
  introBusy = true;
  try {
    if (!(await fetch("/restart", { method: "POST" })).ok) throw new Error("restart");
    const response = await fetch("/state", { cache: "no-store" });
    if (!response.ok) throw new Error("state");
    snap = await response.json();
    lastSent = "";
    showMenu();
  } catch (e) {
    screenMessage.textContent = "Chưa thể về menu. Hãy thử lại.";
    screenMessage.hidden = false;
  } finally {
    introBusy = false;
  }
}
function showDayResult(state) {
  const result = state.day_result || {};
  const change = result.reputation_delta || 0;
  showScreen("day-result", `Kết quả ngày ${state.day}`, [
    element("p", `Đã phục vụ ${result.served || 0} · Bỏ đi ${result.left || 0}`),
    element("p", `Tiền ca ${result.shift_earned || 0} nghìn · Boa ${result.tips || 0} nghìn`),
    element("p", `Uy tín ${change > 0 ? "+" : ""}${change}`),
  ], [action("Ghé tiệm", continueDay)]);
}
function showSummary(state) {
  showScreen("summary", "Tổng kết", [
    element("p", `Tổng thu ${state.earned} nghìn · Số dư ${state.money} nghìn`),
    element("p", `Tổng điểm ${state.score} · Uy tín ${Number(state.reputation.toFixed(2))}`),
    listSection("Món bán chạy", Object.entries(state.best_sellers || {}).map(([id, count]) => `${dishName(id)} × ${count} suất`), "Chưa bán được món nào."),
  ], [action("Về menu", returnToMenu)]);
}

const UPGRADE_NAMES = {oxygen: "Bình oxy", hp: "Áo phao", weapon: "Lao xua", net: "Vợt hút cá"};
const BUY_ERRORS = {funds: "Không đủ tiền.", max_level: "Đã đạt cấp tối đa.", out_of_stock: "Hết hàng.", unknown: "Không có mặt hàng này."};
const upgradeRows = new Map();

function setText(node, value) {
  if (node.textContent !== value) node.textContent = value;
}
function renderShop(state) {
  shop.hidden = false;
  setText(shopBalance, `Số dư ${state.money} nghìn · Còn ${fmtTime(state.time_left_ticks)}`);
  for (const [id, tiers] of Object.entries(state.meta?.upgrades || {})) {
    if (!upgradeRows.has(id)) {
      const name = element("strong", UPGRADE_NAMES[id] || id);
      const detail = element("span", "");
      const text = document.createElement("div");
      text.append(name, detail);
      const button = action("Mua", () => sendInput({ buy: id }));
      button.setAttribute("aria-label", `Mua ${UPGRADE_NAMES[id] || id}`);
      const row = document.createElement("div");
      row.className = "upgrade";
      row.append(text, button);
      shopUpgrades.append(row);
      upgradeRows.set(id, {detail, button});
    }
    const {detail, button} = upgradeRows.get(id);
    const level = state.upgrades?.[id] || 0;
    const active = state.active_upgrades?.[id] || 0;
    const next = tiers.find((tier) => tier.level === level + 1);
    const benefit = next?.oxygen_max_s ? ` · Cấp kế ${next.oxygen_max_s} s oxy` : next?.hp_max ? ` · Cấp kế ${next.hp_max} Máu` : "";
    setText(detail, `Cấp ${level}${level > active ? " · Có hiệu lực ngày sau" : ""}${benefit}`);
    setText(button, next ? `Mua · ${next.price} nghìn` : "Cấp tối đa");
    button.disabled = !next;
  }
  const feedback = (state.events || []).findLast((e) => e.day === state.day && e.phase === "shop" && ["bought", "buy_failed"].includes(e.name));
  const message = !feedback ? "" : feedback.name === "bought"
    ? `Đã mua ${UPGRADE_NAMES[feedback.data.upgrade] || feedback.data.upgrade} cấp ${feedback.data.level}.`
    : (BUY_ERRORS[feedback.data.reason] || "Mua không thành công.");
  setText(shopFeedback, message);
}
document.getElementById("shop-done").addEventListener("click", () => press("shop_done"));
document.getElementById("shop-pause").addEventListener("click", () => press("pause"));

function updateDayScreen(previous) {
  if (snap.mode !== "day") {
    if (snap.menu_pending) {
      const starting = dayStarted && previous?.menu_pending && !screenName;
      if (!starting && !["menu","help","exit","evening-intro","atlas-lobby"].includes(screenName) && !introBusy) showMenu();
      return;
    }
    if (snap.error || snap.finished) {
      const page = snap.error ? "error" : "finished";
      const reasons = {docked:"Đã cập bến",time:"Đã hết giờ",fainted:"Út Sen đã ngất"};
      if (screenName !== page) showScreen(page,snap.error ? "Lỗi phiên chơi" : reasons[snap.reason] || "Đã hết ca",[],[action("Về màn hình chính",returnToMenu)]);
    } else if (snap.state === "paused") {
      if (screenName !== "pause") showPause();
    } else if (screenName === "pause") closeScreen();
    return;
  }
  if (previous?.mode !== "day") {
    if (snap.tick === 0) showMenu();
    else dayStarted = true;
  }
  if (!dayStarted) return;
  if (snap.error) {
    if (screenName !== "error") showScreen("error", "Lỗi phiên chơi", [], [action("Về menu", returnToMenu)]);
    return;
  }
  if (snap.finished || snap.state === "finished") {
    shop.hidden = true;
    if (screenName !== "summary") showSummary(snap);
    return;
  }
  if (snap.phase === "shop") renderShop(snap);
  else shop.hidden = true;
  if (snap.state === "paused") {
    if (screenName !== "pause") showPause();
    return;
  }
  if (screenName === "pause") closeScreen();
  if (snap.phase === previous?.phase && snap.day === previous?.day) return;
  if (snap.intro_pending === false) return;
  if (snap.phase === "gather") showDayIntro(snap);
  if (snap.phase === "quan") showEveningIntro(snap);
  if (snap.phase === "shop") showDayResult(snap);
}

function showPause() {
  renderAtlas(false);
}

// ---------- ra: poll snapshot ----------
async function poll() {
  const previous = snap;
  try {
    const response = await fetch("/state", { cache: "no-store" });
    if (!response.ok) throw new Error("state");
    snap = await response.json();
    offline = false;
  } catch {
    offline = true;
  }
  document.getElementById("connection").hidden = !offline;
  try {
    if (!offline) {
      updateDayScreen(previous);
      renderHud();
      window.paintCharts?.();
    }
  } finally {
    setTimeout(poll, document.hidden ? 250 : 45);
  }
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc bông điên điển",
  ca_keo_nuong: "Cá kèo nướng muối ớt",
  lau_mam: "Lẩu mắm miền Tây",
};
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function dishName(dish) {
  const id = typeof dish === "string" ? dish : dish?.dish_id;
  return DISH_NAME[id] || id || "";
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.maxWidth === undefined) ctx.fillText(s, x, y);
  else ctx.fillText(s, x, y, o.maxWidth);
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const MONSTER_COLOR = "#c9a0ff";
const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

function availableStock(state) {
  if (state.available_stock) return state.available_stock;
  const available = { ...state.stock };
  for (const customer of state.customers || []) {
    for (const [kind, count] of Object.entries(customer.reserved || {})) {
      available[kind] = (available[kind] ?? 0) - count;
    }
  }
  return available;
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const compact = w < 600;
  const size = compact ? 14 : 18;
  const top = compact ? 130 : 110, bottom = 66;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    if (!compact) text(d + " m", sx(0) + 4, sy(d) - 2, { size, color: "#ccdae6" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  if (!compact) text("Bến", sx(dp[0]), sy(-2.8), { size, color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  const monsters = snap.monsters || [];
  for (const monster of monsters) {
    ctx.fillStyle = MONSTER_COLOR;
    ctx.beginPath();
    ctx.ellipse(sx(monster.pos[0]), sy(monster.pos[1]), 1.35 * s, .58 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const stoves = snap.stoves || [], customers = snap.customers || [];
  const tables = snap.tables || [];
  const compact = w < 760;
  const size = compact ? 14 : 18;
  const top = 76, bottom = 70;
  const X = b.x[1], Z = b.z[1];
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  stoves.forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 5, { size, align: "center", color: "#111" });
  });
  // bàn + khách
  const byTable = {};
  customers.forEach((c) => (byTable[c.table_id] = c));
  tables.forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 5, { size, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
  }
}

const hud = document.getElementById("play-hud");
const hudStats = document.getElementById("hud-stats");
const ledger = document.getElementById("ledger-rows");
const hudPrompt = document.getElementById("hud-prompt");
const ledTitle = document.getElementById("ledger-title");
const hudTime = document.getElementById("hud-time");
let hintMode = "";
function rows(parent, lines) {
  const cache = JSON.stringify(lines);
  if (parent.dataset.content === cache) return;
  parent.dataset.content = cache;
  const items = lines.map(line => {
    if (line.fraction !== undefined) {
      const meter = document.createElement("div");
      meter.className = "oxygen" + (line.warn ? " low":"");
      const fill = document.createElement("i");
      fill.style.width = Math.max(0,Math.min(1,line.fraction))*100 + "%";
      meter.append(fill); return meter;
    }
    const row = element("span",line.text || line);
    row.className = line.warn ? "row warn" : "row"; return row;
  });
  parent.replaceChildren(...items);
}
function near(a,b,radius) { return Array.isArray(a) && Array.isArray(b) && distance(a,b) <= radius; }
function renderHud() {
  const phase = snap.phase || snap.mode;
  hud.hidden = !screen.hidden || !shop.hidden || !["gather","quan"].includes(phase);
  if (hud.hidden) return;
  const morning = phase === "gather";
  const forageGuide = document.getElementById("forage-guide");
  const serviceGuide = document.getElementById("service-guide");
  forageGuide.hidden = !morning || !window.ForageGuide;
  serviceGuide.hidden = morning || !window.ServiceGuide;
  if (morning) window.ForageGuide?.render(snap, forageGuide);
  const waitButton = document.getElementById("wait-turn");
  waitButton.hidden = morning || !snap.can_wait;
  if (!waitButton.hidden) waitButton.textContent = snap.wait_to_close ? "Thu dọn đến hết ca" : "Chờ lượt khách kế tiếp";
  window.showRecentAction?.(snap);
  const meta = snap.meta || {};
  const p = snap.player || {};
  const day = snap.day ? "Ngày " + snap.day + " · " : "";
  setText(document.getElementById("hud-phase"), day + (morning ? "Lặn & hái" : "Mở quán"));
  document.getElementById("hud-phase-icon").setAttribute("href",morning ? "#i-sun":"#i-bowl");
  setText(hudTime,fmtTime(snap.time_left_ticks));
  hudTime.classList.toggle("urgent", snap.time_left_ticks <= 30*60);
  if (hintMode !== phase) {
    hintMode = phase;
    const actions = [["WASD","Di chuyển"],["E",morning?"Hái / cập bến":"Bếp / bàn"]];
    if (morning) actions.push(["Space","Bắt cá"]);
    actions.push(["M","Bản đồ"],["Esc","Sổ tay"]);
    document.getElementById("key-hints").replaceChildren(...actions.map(([key,label]) => {
      const hint=element("span",label); hint.prepend(element("kbd",key)); return hint;
    }));
    document.querySelector('[data-action="catch"]').hidden=!morning;
  }
  let warning = false;
  let prompt = "";
  if (morning) {
    const oxy = p.oxygen_ticks || 0, maxOxy = p.oxygen_max_ticks || 1;
    const low = oxy / maxOxy < .25;
    const cooldown = p.catch_cd_ticks ? (p.catch_cd_ticks/60).toFixed(1) + " s" : "sẵn sàng";
    rows(hudStats,[{text:"Oxy " + (oxy/60).toFixed(1) + " s",warn:low},{fraction:Math.round(oxy/maxOxy*100)/100,warn:low},
      "Máu " + p.hp + "/" + p.hp_max, "Độ sâu " + (p.pos?.[1] || 0).toFixed(1) + " m","Vợt " + cooldown]);
    const hold = {};
    for (const item of snap.hold || []) {
      const kind = item.kind || item;
      hold[kind] = (hold[kind] || 0) + 1;
    }
    const goals = snap.day_plan?.ingredients || {};
    setText(ledTitle,"Giỏ " + (snap.hold_count ?? snap.hold?.length ?? 0) + "/" + snap.hold_capacity);
    const items = Object.keys({...goals,...hold}).map(kind => (KIND_NAME[kind] || kind) + " · " + (hold[kind] || 0) + (goals[kind] ? "/" + goals[kind] + " cần" : ""));
    rows(ledger,items.length ? items : ["Giỏ trống"]);
    warning = (snap.monsters || []).some(m => {
      const species=meta.monsters?.species?.[m.kind];
      return species && p.pos?.[1] >= species.depths[0] && near(p.pos,m.pos,species.detect_radius);
    });
    if (near(p.pos,meta.dock_pos,meta.dock_radius)) prompt="E · Cập bến";
    else if (p.at_surface && (snap.nodes || []).some(n=>n.ready && near(p.pos,n.pos,meta.interact_radius))) prompt="E · Hái bông";
    const danger=[warning?"Thủy quái!":"",oxy===0?"Hết hơi!":"",prompt].filter(Boolean);
    prompt=danger.join(" · ");
  } else {
    const inventory=ingredientLines(availableStock(snap)).join(", ");
    rows(hudStats,["Tiền ca " + (snap.shift_earned ?? snap.earned ?? 0) + " nghìn", "Uy tín " + Number((snap.reputation ?? 0).toFixed(2)),
      "Đang bưng · " + (dishName(snap.hand) || "Tay trống"), "Kho · " + (inventory || "Trống")]);
    setText(ledTitle,"Bếp và bàn ăn");
    const stations=[];
    for (const stove of snap.stoves || []) {
      const dish=dishName(stove.dish);
      stations.push(stove.id + " · " + (stove.state === "cooking" ? dish + " · " + Math.ceil(stove.cook_ticks_left / 60) + " s" : stove.state==="ready" ? dish + " · Đã chín" : "Bếp trống"));
      if (stove.state === "cooking") {
        const total=(snap.menu?.[stove.dish?.dish_id || stove.dish]?.cook_s || 0)*60;
        if (total) stations.push({fraction:1 - stove.cook_ticks_left / total});
      }
    }
    for (const table of snap.tables || []) {
      const c=(snap.customers || []).find(customer=>customer.table_id===table.id);
      const wait=c?.state==="waiting", low=wait && c.patience_ticks_left < meta.patience_s*60/4;
      const status=c ? dishName(c.dish_id) + " · " + (wait ? Math.ceil(c.patience_ticks_left/60) + " s":"Đang ăn") : "Bàn trống";
      stations.push({text:table.id + " · " + status,warn:low});
    }
    rows(ledger,stations);
    prompt = window.ServiceGuide?.render(snap, serviceGuide) || "";
  }
  const touchAction = document.querySelector('[data-action="interact"]');
  const nearbyAction = prompt.match(/E · (.+)$/)?.[1];
  setText(touchAction, nearbyAction || (morning ? "Hái bông" : "Tương tác"));
  setText(hudPrompt, matchMedia("(pointer:coarse)").matches ? prompt.replace("E · ", "") : prompt);
  renderFieldStatus(snap, warning);
  hud.classList.toggle("danger", warning);
}
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const guide = document.getElementById(snap?.phase === "quan" ? "service-guide" : "forage-guide");
  window.gameView = { state:snap, screen:["help","exit","atlas-lobby"].includes(screenName) ? "menu" : screenName,
    targetId: screen.hidden && shop.hidden && !guide.hidden ? guide.dataset.targetId : null };
  if (document.body.classList.contains("has-3d")) return;
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const phase = snap.phase || snap.mode;
    if (phase === "quan") drawQuan(w, h);
    if (phase === "gather") drawGather(w, h);

  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
